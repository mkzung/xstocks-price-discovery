name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: estimator recovers its known answer
        run: python -m pytest tests -q
      - name: every number in the post matches the data
        run: python analysis/verify.py
      - name: the calibration reproduces
        run: python analysis/calibrate.py
      - name: sparse trading cannot invent the finding
        run: python analysis/staleness.py
      - name: cointegration, second estimator, bootstrap
        run: python analysis/robustness.py 2026-07-29b
      - name: lags, grid, artefact risk, second window
        run: python analysis/sensitivity.py 2026-07-29b
      - name: the cointegrating vector, fitted rather than imposed
        run: python analysis/vector.py 2026-07-29b
      - name: the second collection day
        run: python analysis/robustness.py 2026-07-30
      - name: the second day's cointegrating vector
        run: python analysis/vector.py 2026-07-30
      - name: the third collection day
        run: python analysis/robustness.py 2026-07-31
      - name: the third day's cointegrating vector
        run: python analysis/vector.py 2026-07-31
      - name: does anything hold across days
        run: python analysis/windows.py 2026-07-29b 2026-07-30 2026-07-31
      - name: figures redraw from the committed data
        run: python analysis/build_analysis.py
      - name: the post's line wrapping is settled
        run: python analysis/format_post.py --check
      - name: the post's formatting, spelling and links
        run: python analysis/check_post.py
      - name: regenerated artefacts match the committed ones
        # PNGs are excluded: freetype and matplotlib versions shift bytes
        # between machines without changing content. The CSVs and the page are
        # deterministic, and drift in them means a stale commit.
        run: git diff --exit-code -- data post/data index.html
